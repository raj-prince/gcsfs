[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "gcs-file-spec"
version = "0.1.0"
description = "Rust (google-cloud-storage SDK) Non-POSIX backend for gcsfs, exposed via PyO3"
requires-python = ">=3.10"

[tool.maturin]
module-name = "gcs_file_spec"
features = ["pyo3/extension-module"]
