[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "gcs-rust-fs-py"
version = "0.1.0"
description = "Thin PyO3 bridge over gcs-rust-fs for gcsfs read, write, and info operations"
requires-python = ">=3.10"

[tool.maturin]
module-name = "gcs_rust_fs_py"
features = ["pyo3/extension-module"]
